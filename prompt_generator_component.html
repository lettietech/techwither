<div class="prompt-generator-box" style="background: #f9fafb; border: 1px solid #e5e7eb; padding: 24px; border-radius: 12px; margin: 30px 0; font-family: inherit;">
  <h3 style="margin-top: 0; color: #111827;">TechWitHer AI Prompt Optimizer</h3>
  <p style="color: #4b5563; font-size: 14px;">Turn a basic idea into a structured, production-ready AI prompt built for advanced models like Claude, Gemini, or GPT.</p>
  
  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: #374151;">Your Core Task or Goal:</label>
    <textarea id="basePromptInput" placeholder="e.g., write an analysis of crypto market trends or debug Python script" rows="3" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box;"></textarea>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
    <div>
      <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: #374151;">Task Domain:</label>
      <select id="promptDomain" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; font-size: 14px;">
        <option value="General Technical & Coding">Software & Code Development</option>
        <option value="Financial & Market Research">Finance, Crypto & Markets</option>
        <option value="Content Creation & Editorial">Tech & Finance Editorial</option>
        <option value="Practical Workflow Automation">Practical Automation & Scripts</option>
      </select>
    </div>
    <div>
      <label style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: #374151;">Desired Tone:</label>
      <select id="toneModifier" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; font-size: 14px;">
        <option value="Professional, Authoritative & Analytical">Professional & Analytical</option>
        <option value="Clear, Concise & Direct">Clear & Direct</option>
        <option value="Engaging & Audience-Focused">Engaging & Editorial</option>
        <option value="Rigorous & Technical">Technical & Precise</option>
      </select>
    </div>
  </div>

  <button onclick="generateOptimizedPrompt()" style="background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;">Optimize Prompt Package</button>

  <div style="margin-top: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
      <label style="font-weight: 600; font-size: 13px; color: #374151;">Generated Prompt Output:</label>
      <button onclick="copyOptimizedPrompt()" style="background: transparent; border: 1px solid #d1d5db; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; color: #4b5563;">Copy Prompt</button>
    </div>
    <textarea id="optimizedPromptOutput" readonly rows="8" style="width: 100%; padding: 12px; background: #ffffff; border: 1px solid #d1d5db; border-radius: 6px; font-family: monospace; font-size: 13px; box-sizing: border-box;" placeholder="Your optimized prompt will appear here..."></textarea>
  </div>
</div>

<script>
  function generateOptimizedPrompt() {
    const rawInput = document.getElementById('basePromptInput').value.trim();
    const domain = document.getElementById('promptDomain').value;
    const tone = document.getElementById('toneModifier').value;
    
    if (!rawInput) {
      alert("Please enter a basic prompt or task description first!");
      return;
    }

    const optimized = `### ROLE & SYSTEM CONTEXT
You are an elite expert AI collaborator specializing in ${domain}. Your outputs are meticulously researched, structurally sound, and tailored for professional execution.

### PRIMARY OBJECTIVE
${rawInput}

### OPERATIONAL CONSTRAINTS & GUIDELINES
- Tone & Style: ${tone}
- Accuracy: Prioritize factual precision, logical consistency, and industry-standard best practices.
- Formatting: Use clean Markdown headers, structured bullet points, and code or data blocks where applicable. Avoid generic fluff or conversational fillers.

### EXECUTION INSTRUCTIONS
Begin processing immediately based on the core objective above. Deliver a comprehensive, production-ready result.`;

    document.getElementById('optimizedPromptOutput').value = optimized;
  }

  function copyOptimizedPrompt() {
    const outputBox = document.getElementById('optimizedPromptOutput');
    if (!outputBox.value) {
      alert("Generate a prompt first before copying!");
      return;
    }
    navigator.clipboard.writeText(outputBox.value);
    alert("Optimized prompt copied to clipboard!");
  }
</script>
